name: Supabase keep-alive

# Supabase's free tier auto-pauses a project after ~7 days with no API
# activity. This makes one harmless request every 2 days so the project
# never goes that long without traffic and never gets paused.
on:
  schedule:
    - cron: '0 9 */2 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase project
        # The anon key is safe to commit here — it's already public, embedded
        # in the deployed app's JS bundle and protected only by Postgres RLS,
        # never by secrecy. Using a repo secret would just add a setup step
        # with no real security benefit.
        run: |
          curl --fail --silent --show-error -X POST \
            "https://tlskfoemfxuhlhyqdztf.supabase.co/rest/v1/rpc/check_invite_code" \
            -H "apikey: sb_publishable_lYxyXdKcq2sr06Z1oy3RUQ_jDv0lCN2" \
            -H "Content-Type: application/json" \
            -d '{"p_code":"KEEPALIVE_PING"}'
